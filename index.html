<!doctype html><html lang="zh"><meta charset="utf-8"><title>纸样 · 本地 DXF 查看器</title><style>
*{box-sizing:border-box}body{margin:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;color:#253d36;background:#edf1ee}header{background:#173d33;color:white;padding:22px 28px;display:flex;justify-content:space-between;align-items:center}h1{font-size:21px;margin:0}header small{color:#bacfc4}nav{display:flex;gap:10px;padding:16px 24px;align-items:center;flex-wrap:wrap}button,select,.file{font:inherit;padding:9px 14px;border:1px solid #bdccc3;background:white;border-radius:6px;cursor:pointer}button:hover,.file:hover{background:#dce9e1}.file{background:#dce9e1}main{display:grid;grid-template-columns:1fr 280px;gap:16px;margin:0 24px}#stage{height:70vh;background:white;border:1px solid #cbd6ce;overflow:hidden;position:relative;touch-action:none;cursor:grab}#stage>svg{width:100%;height:100%;display:block}#empty{padding:100px 30px;text-align:center;color:#6a8075}aside{background:white;padding:18px;max-height:70vh;overflow:auto;border-radius:8px}h3{font-size:14px;margin:16px 0 9px}.layer{display:block;padding:4px}#status{margin:0 24px 12px;color:#526b5f}#notes{font-size:12px;line-height:1.7;color:#7b623d}#texts{white-space:pre-wrap;word-break:break-word;font-size:12px;line-height:1.8}#print{display:none}footer{padding:18px 24px;color:#6b7d72;font-size:12px}@media print{body>*{display:none!important}#print{display:block!important}#print svg{width:100%;height:auto}@page{size:A3 landscape;margin:10mm}}@media(max-width:750px){main{grid-template-columns:1fr}aside{max-height:250px}}
 .piece{cursor:move}.piece.selected>.frame{stroke:#148462;stroke-width:2}.piece text{pointer-events:none;user-select:none}.annotation.selected text{fill:#c0471c;stroke:#c0471c;stroke-width:0.15px}.annotation:hover text{fill:#c0471c}</style><header><h1>纸样查看器 <small> / DXF</small></h1><small>本机处理 · 原文件只读</small></header><nav><label class="file">打开 DXF<input id="file" type="file" accept=".dxf" hidden></label><select id="enc" aria-label="文字编码"><option value="auto">自动检测编码</option value="gbk">GBK / CP936</option><option value="utf-8">UTF-8</option><option value="big5">繁体 Big5</option><option value="cp1252">西文 CP1252</option></select><button id="reset">恢复标注位置</button><button id="fit">适应窗口</button><button id="plus">放大</button><button id="minus">缩小</button><label>拐点阈值 <select id="corner"><option value="15">15°（更多分段）</option><option value="25" selected>25°</option><option value="40">40°（更少分段）</option><option value="60">60°</option></select></label><button id="measure">两点测距：关闭</button><button id="clearmeasure">清除测量</button><button id="png">下载 PNG</button><button id="pdf">打印 / 保存 PDF</button></nav><div id="status">选择文件，或将 DXF 拖入页面</div><main><div id="stage"><div id="empty">打开纸样，查看轮廓与中文标注<br><br>滚轮缩放 · 拖动标注移动 · 拖动空白平移</div></div><aside><h3>读取提示</h3><div id="notes">尚未加载文件</div><h3>图层</h3><div id="layers"></div><h3>文字信息</h3><div id="texts"></div></aside></main><footer>为保持文字可见，预览使用中文字体替代原字体。显示效果不等同于原制版软件；不覆盖保存 DXF。</footer><div id="tooltip" style="display:none;position:fixed;pointer-events:none;background:#153d32;color:white;padding:8px 12px;border-radius:5px;z-index:10"></div><div id="print"></div><script>
const $=id=>document.getElementById(id);let file,data,hidden=[],box,original,busy=false,measuring=false,firstPoint=null;
async function load(f){if(busy)return;if(f){file=f;hidden=[]}if(!file)return;if(file.size>30*1024*1024){$('status').textContent='文件超过 30 MB 限制';return}busy=true;$('status').textContent='正在解析与绘制，请稍候…';document.querySelectorAll('button,select,input').forEach(x=>x.disabled=true);try{const a=new Uint8Array(await file.arrayBuffer());let str='';for(let i=0;i<a.length;i+=32768)str+=String.fromCharCode(...a.subarray(i,i+32768));const r=await fetch('/render',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({data:btoa(str),encoding:$('enc').value,corner_angle:+$('corner').value,hidden})});data=await r.json();if(!r.ok)throw Error(data.error);data.unit='mm';data.warnings=data.warnings.filter(w=>!w.includes('文件未明确指定单位'));data.warnings.unshift('单位：mm（按用户确认，1 绘图单位 = 1 mm；原文件不变）。');buildScene();$('status').textContent=`${file.name} · ${data.version} · 编码 ${data.encoding} · 单位 mm（用户指定）`;$('notes').textContent=data.warnings.join('\n');$('texts').textContent=data.texts.map(t=>`${t.block}\n${t.text}`).join('\n\n');$('layers').replaceChildren();for(const l of data.layers){const label=document.createElement('label');label.className='layer';const c=document.createElement('input');c.type='checkbox';c.checked=!hidden.includes(l);c.onchange=()=>{hidden=c.checked?hidden.filter(x=>x!==l):[...hidden,l];load()};label.append(c,document.createTextNode(' '+l));$('layers').append(label)}}catch(e){$('status').textContent='读取失败：'+e.message;$('stage').innerHTML='';data=null}finally{busy=false;document.querySelectorAll('button,select,input').forEach(x=>x.disabled=false)}}
const NS='http://www.w3.org/2000/svg';function node(tag,attrs={},text){const n=document.createElementNS(NS,tag);for(const [k,v] of Object.entries(attrs))n.setAttribute(k,v);if(text!==undefined)n.textContent=text;return n}
function chinese(s){const map={'Piece Name':'裁片名称','Category':'类别','Material':'材料','Size':'尺码','Annotation':'标注','Quantity':'数量','Style Name':'款号','Creation Date':'创建日期','Creation Time':'创建时间','Author':'作者','VERSION':'版本','Sample Size':'样码','Units':'单位','TOLERANCE':'文件公差参数'};return s.replace(/^([^:]+):/,(_,k)=>(map[k]||k)+'：')}
function buildScene(){firstPoint=null;$('stage').innerHTML=data.svg;const scene=$('stage').querySelector('svg');original=exportBounds();box=[...original];update()}
function exportBounds(){const scene=$('stage').querySelector('svg');const b=scene.getBBox();const pad=b.width*.02;return [b.x-pad,b.y-pad,b.width+2*pad,b.height+2*pad]}
function exportSvg(){const c=$('stage').querySelector('svg').cloneNode(true);c.querySelector('#measurement-lines')?.remove();c.querySelector('#hover-highlight')?.remove();c.setAttribute('viewBox',exportBounds().join(' '));c.setAttribute('width','1600');c.setAttribute('height',Math.round(1600*exportBounds()[3]/exportBounds()[2]));return new XMLSerializer().serializeToString(c)}
$('reset').onclick=()=>{if(data)buildScene()};
function formatLength(v){return Number(v.toFixed(4)).toLocaleString('zh-CN',{maximumFractionDigits:4})+' '+data.unit}
function showLineHighlight(line){const scene=$('stage').querySelector('svg');if(!scene)return;scene.querySelector('#hover-highlight')?.remove();if(!line)return;const mark=line.cloneNode(false);mark.removeAttribute('class');mark.id='hover-highlight';mark.setAttribute('stroke','#e02c2c');mark.setAttribute('stroke-width','3');mark.setAttribute('vector-effect','non-scaling-stroke');mark.setAttribute('stroke-linecap','round');mark.setAttribute('stroke-linejoin','round');mark.setAttribute('pointer-events','none');scene.append(mark)}
function hoverLength(e){let l=e.target.closest('.measure-line');const tip=$('tooltip');showLineHighlight(!drag&&!measuring?l:null);if(!l||drag||measuring){tip.style.display='none';return}tip.textContent=`${l.dataset.kind==='连续轮廓总长'?'多段线（单个原始实体）':l.dataset.kind} · ${l.dataset.approx==='true'?'约 ':''}${formatLength(+l.dataset.length)} · 图层 ${l.dataset.layer}`;tip.style.display='block';tip.style.left=Math.min(e.clientX+15,window.innerWidth-360)+'px';tip.style.top=(e.clientY+18)+'px'}
$('stage').onpointerleave=()=>{$('tooltip').style.display='none';showLineHighlight(null)};
$('measure').onclick=()=>{measuring=!measuring;firstPoint=null;showLineHighlight(null);$('measure').textContent='两点测距：'+(measuring?'开启':'关闭');$('tooltip').style.display='none';$('status').textContent=measuring?'依次点击两个位置，计算平面直线距离（自由点选，不吸附端点）。':'测距已关闭；可拖动标注，悬停线条查看长度。'};
$('clearmeasure').onclick=()=>{firstPoint=null;$('stage').querySelector('#measures')?.remove()};
function measureClick(e){const p=point(e),scene=$('stage').querySelector('svg');let g=scene.querySelector('#measures');if(!g){g=node('g',{id:'measures','pointer-events':'none'});scene.append(g)}const factor=1/scene.getScreenCTM().a;g.append(node('circle',{cx:p.x,cy:p.y,r:4*factor,fill:'#c0471c'}));if(!firstPoint){firstPoint=p;$('status').textContent='已选第一个点，请选择第二个点。';return}const length=Math.hypot(p.x-firstPoint.x,p.y-firstPoint.y)/data.coordinate_scale;g.append(node('line',{x1:firstPoint.x,y1:firstPoint.y,x2:p.x,y2:p.y,stroke:'#c0471c','stroke-width':2,'vector-effect':'non-scaling-stroke'}));g.append(node('text',{x:(p.x+firstPoint.x)/2,y:(p.y+firstPoint.y)/2-10*factor,'font-size':14*factor,'font-family':'Arial Unicode MS, PingFang SC, sans-serif',fill:'#b3310c',stroke:'white','stroke-width':3*factor,'paint-order':'stroke'},formatLength(length)));$('status').textContent='两点平面距离：'+formatLength(length)+'；可继续点选下一组。';firstPoint=null}
$('file').onchange=e=>load(e.target.files[0]);$('enc').onchange=()=>load();$('corner').onchange=()=>load();function update(){if(box)$('stage').querySelector('svg').setAttribute('viewBox',box.join(' '))}function zoom(f){if(!box)return;box=[box[0]+box[2]*(1-f)/2,box[1]+box[3]*(1-f)/2,box[2]*f,box[3]*f];update()}$('fit').onclick=()=>{if(original){original=exportBounds();box=[...original];update()}};$('plus').onclick=()=>zoom(.8);$('minus').onclick=()=>zoom(1.25);$('stage').onwheel=e=>{e.preventDefault();zoom(e.deltaY>0?1.12:.89)};let drag;function point(e){const svg=$('stage').querySelector('svg'),p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse())}
$('stage').onpointerdown=e=>{if(!box)return;if(measuring){measureClick(e);return;}const g=e.target.closest('.annotation');const p=point(e);drag={g,p,x:g?+g.dataset.x:box[0],y:g?+g.dataset.y:box[1],clientX:e.clientX,clientY:e.clientY,scale:$('stage').querySelector('svg').getScreenCTM().a};document.querySelectorAll('.annotation').forEach(n=>n.classList.remove('selected'));if(g)g.classList.add('selected');$('stage').setPointerCapture(e.pointerId)};
$('stage').onpointermove=e=>{hoverLength(e);if(!drag)return;if(drag.g){const p=point(e),x=drag.x+p.x-drag.p.x,y=drag.y+p.y-drag.p.y;drag.g.dataset.x=x;drag.g.dataset.y=y;drag.g.setAttribute('transform',`translate(${x} ${y})`)}else{box[0]=drag.x-(e.clientX-drag.clientX)/drag.scale;box[1]=drag.y-(e.clientY-drag.clientY)/drag.scale;update()}};
$('stage').onpointerup=()=>drag=null;$('stage').onpointercancel=()=>drag=null;
document.ondragover=e=>e.preventDefault();document.ondrop=e=>{e.preventDefault();if(e.dataTransfer.files[0])load(e.dataTransfer.files[0])};$('pdf').onclick=()=>{if(data){$('print').innerHTML=exportSvg();window.print()}};$('png').onclick=()=>{if(!data)return;const blob=new Blob([exportSvg()],{type:'image/svg+xml'}),url=URL.createObjectURL(blob),img=new Image;img.onload=()=>{const c=document.createElement('canvas');c.width=4000;const vb=exportBounds();c.height=Math.max(1,Math.round(4000*vb[3]/vb[2]));const ctx=c.getContext('2d');ctx.fillStyle='white';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(img,0,0,c.width,c.height);c.toBlob(b=>{const u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=file.name.replace(/\.dxf$/i,'')+'.png';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)});URL.revokeObjectURL(url)};img.src=url};
</script></html>
